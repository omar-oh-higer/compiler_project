<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <style>
        .card {
            padding: 10px;
            border: 1px solid #ccc;
        }
        .price {
            color: #2a7a2a;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>Our Products</h1>
    <!-- product list, one card per product -->
    <div class="list">
        {% for product in products %}
        <div class="card">
            <img src="{{ product.image }}" alt="product photo">
            <h2>{{ product.name }}</h2>
            <p class="price">{{ product.price | round(2) }}</p>
            <a href="/products/{{ product.id }}">Details</a>
            <a href="/products/{{ product.id }}/edit">Edit</a>
            <a href="/products/{{ product.id }}/delete">Delete</a>
        </div>
        {% else %}
        <p>No products yet.</p>
        {% endfor %}
    </div>
    <a href="/add">Add product</a>
</body>
</html>
